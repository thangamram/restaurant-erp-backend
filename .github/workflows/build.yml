name: Build Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests > build.log 2>&1 || true
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add build.log
        git commit -m "Upload build log" || true
        git push
