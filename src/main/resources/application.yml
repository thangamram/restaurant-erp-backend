server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: restaurant-erp-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurant_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:2007@25thangam}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:noreply@restaurant-erp.com}
    password: ${SPRING_MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000 # 24 Hours
    refresh-token-expiration-ms: 604800000 # 7 Days

  security:
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 30

  restaurant:
    name: "Royal Gourmet Restaurant & Lounge"
    address: "123 Culinary Boulevard, Suite 500, Tech Park, City"
    phone: "+1 (555) 019-2834"
    email: "info@royalgourmet.com"
    tax-number: "GSTIN33AAACR1234F1Z5"
    currency-symbol: "$"
    default-gst-percentage: 5.0
    default-service-charge-percentage: 5.0

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
